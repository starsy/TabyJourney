<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabyJourney</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <h1 class="title">🧭 TabyJourney</h1>
      <div class="controls">
        <button id="backward-btn" class="nav-btn" title="Backward (Alt+←)">←</button>
        <button id="forward-btn" class="nav-btn" title="Forward (Alt+→)">→</button>
        <span class="count">履歴: <span id="history-count">0 / 100</span></span>
      </div>
    </div>

    <!-- 履歴リスト -->
    <div id="history-list" class="history-list">
      <!-- 動的に生成 -->
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
