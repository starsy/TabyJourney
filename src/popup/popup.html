<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabyJourney</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">🧭 TabyJourney</h1>
      <div class="controls">
        <button id="backward-btn" class="nav-btn" title="Navigate backward in tab history" aria-label="Navigate backward in tab history">←</button>
        <button id="forward-btn" class="nav-btn" title="Navigate forward in tab history" aria-label="Navigate forward in tab history">→</button>
        <span class="count">History: <span id="history-count">0 / 100</span></span>
      </div>
    </div>

    <!-- History list -->
    <div id="history-list" class="history-list">
      <!-- Dynamically generated -->
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
