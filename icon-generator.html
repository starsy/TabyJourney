<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabyJourney Icon Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
    }
    .preview {
      display: flex;
      gap: 40px;
      margin: 30px 0;
      align-items: center;
    }
    .icon-preview {
      text-align: center;
    }
    .icon-preview h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #4285f4;
      color: white;
      font-weight: 500;
    }
    button:hover {
      background: #357ae8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧭 TabyJourney Icon Generator</h1>
    <p>タブ履歴ナビゲーションを表現したアイコンです。</p>

    <div class="preview">
      <div class="icon-preview">
        <h3>16x16</h3>
        <canvas id="canvas16" width="16" height="16"></canvas>
      </div>
      <div class="icon-preview">
        <h3>48x48</h3>
        <canvas id="canvas48" width="48" height="48"></canvas>
      </div>
      <div class="icon-preview">
        <h3>128x128</h3>
        <canvas id="canvas128" width="128" height="128"></canvas>
      </div>
    </div>

    <div class="buttons">
      <button onclick="downloadIcon(16)">16x16をダウンロード</button>
      <button onclick="downloadIcon(48)">48x48をダウンロード</button>
      <button onclick="downloadIcon(128)">128x128をダウンロード</button>
    </div>
  </div>

  <script>
    // アイコンを描画する関数
    function drawIcon(ctx, size) {
      const scale = size / 128;

      // 背景を透明にリセット
      ctx.clearRect(0, 0, size, size);

      // グラデーション背景
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4285f4');
      gradient.addColorStop(1, '#34a853');

      // 角丸の正方形背景
      ctx.fillStyle = gradient;
      const radius = 12 * scale;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // タブを表現する積み重なった矩形
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 3 * scale;

      // 後ろのタブ
      const tabWidth = 60 * scale;
      const tabHeight = 40 * scale;
      const tabX = (size - tabWidth) / 2 + 8 * scale;
      const tabY = (size - tabHeight) / 2 - 8 * scale;

      ctx.fillRect(tabX, tabY, tabWidth, tabHeight);
      ctx.strokeRect(tabX, tabY, tabWidth, tabHeight);

      // 前のタブ
      const frontX = tabX - 8 * scale;
      const frontY = tabY + 12 * scale;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fillRect(frontX, frontY, tabWidth, tabHeight);
      ctx.strokeRect(frontX, frontY, tabWidth, tabHeight);

      // 矢印（左向き・右向き）
      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2.5 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 左矢印（戻る）
      const arrowSize = 10 * scale;
      const leftArrowX = frontX + tabWidth / 3;
      const leftArrowY = frontY + tabHeight / 2;

      ctx.beginPath();
      ctx.moveTo(leftArrowX + arrowSize * 0.3, leftArrowY - arrowSize * 0.5);
      ctx.lineTo(leftArrowX - arrowSize * 0.3, leftArrowY);
      ctx.lineTo(leftArrowX + arrowSize * 0.3, leftArrowY + arrowSize * 0.5);
      ctx.stroke();

      // 右矢印（進む）
      const rightArrowX = frontX + (tabWidth / 3) * 2;
      const rightArrowY = frontY + tabHeight / 2;

      ctx.beginPath();
      ctx.moveTo(rightArrowX - arrowSize * 0.3, rightArrowY - arrowSize * 0.5);
      ctx.lineTo(rightArrowX + arrowSize * 0.3, rightArrowY);
      ctx.lineTo(rightArrowX - arrowSize * 0.3, rightArrowY + arrowSize * 0.5);
      ctx.stroke();
    }

    // 各サイズのアイコンを描画
    function renderAllIcons() {
      const sizes = [16, 48, 128];
      sizes.forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);
      });
    }

    // ダウンロード機能
    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // ページ読み込み時にアイコンを描画
    renderAllIcons();
  </script>
</body>
</html>
